<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jew Crew</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="script.js" defer></script>
</head>
<body class="account-body">
    
    <div class="login-container">
        <div class="bannerTitle">Login</div>
        <div class="log-sign-container">
            <div class="btn loginbtn">Login</div>
            <div class="btn">Sign Up</div>
        </div>
    

    <form action="example.com/path" method="post" class="form">
    <input type="text" id="full-name" placeholder="Full Name" name="full-name">
    <input type="text" id="email" placeholder="Email Address" name="email">
    <input type="text" id="password" placeholder="Password" name="password">
    <button type="submit" class="submit-button">Login</button>
    </form>

    <div class="subliner"> Don't have an account? <a href="" class="">Sign Up now</a></div>
    </div>
    
    <div class="footer">
        <div class="home">
            <a href="index.html">
            <img  width="20" height="20" src="svgs/homeImage.svg">
            </a>
        </div>
        <a href="account.html">
        <div class="account">
            <img  width="25" height="25" src="svgs/accountImage.svg" href="account.html">
        </div>
        </a>
    </div>
    
    
</body>
</html>
